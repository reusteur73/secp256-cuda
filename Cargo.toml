[package]
name = "utxo_loader"
version = "0.1.0"
edition = "2021"

[dependencies]
csv = "1.3"
serde = { version = "1.0", features = ["derive"] }
rayon = "1.8"
redis = "0.23"
secp256k1 = { version = "0.28", features = ["rand"] }
sha2 = "0.10"
ripemd = "0.1"
bs58 = "0.5"
rand = "0.8"
hex = "0.4"
reqwest = { version = "0.11", features = ["blocking", "json"] }
serde_json = "1.0"
num-format = "0.4.4"
tungstenite = "0.17"
url = "2"
rustacuda = "0.1"